# Pipeline de infraestrutura (Azure DevOps): valida o Terraform de infra/ a cada mudança.
# Não usa credencial: `fmt` e `validate` rodam sem acessar o Azure nem o state remoto.
# O app (build, testes, E2E e deploy) e o `terraform plan` com OIDC ficam no GitHub Actions
# (.github/workflows/deploy.yml). O `apply` é sempre manual (infra/IMPORT.md).
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

steps:
  - script: terraform version
    displayName: Versão do Terraform

  - script: terraform fmt -check -recursive -diff
    displayName: terraform fmt
    workingDirectory: infra

  # Sem backend: baixa só os providers, o suficiente para validar a configuração.
  - script: terraform init -backend=false -input=false
    displayName: terraform init (sem backend)
    workingDirectory: infra

  - script: terraform validate -no-color
    displayName: terraform validate
    workingDirectory: infra
