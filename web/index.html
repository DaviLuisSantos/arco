<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('arco-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
            var c = t === 'light' ? '#f5f6fa' : '#0f1117'
            var m = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < m.length; i++) {
              m[i].setAttribute('content', c)
              m[i].removeAttribute('media')
            }
          }
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Arco — hábitos com progresso e objetivo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arco</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
